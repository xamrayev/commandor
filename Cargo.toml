[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Bog‘liqliklar talabi (eframe 0.35) bo‘yicha minimal; amalda faqat 1.94.1 da sinalgan.
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
commandor-core = { path = "crates/commandor-core" }
commandor-broker = { path = "crates/commandor-broker" }
commandor-ui = { path = "crates/commandor-ui" }
commandor-ipc = { path = "crates/commandor-ipc" }
commandor-i18n = { path = "crates/commandor-i18n" }
commandor-fs = { path = "crates/commandor-fs" }

crossbeam-channel = "0.5.17"
eframe = "0.35.0"
rfd = "0.15"
fluent-bundle = "0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Tomlar (disklar) ro‘yxati: faqat `disk` imkoniyati, unsafe bizning crate’larda emas.
sysinfo = { version = "0.34.2", default-features = false, features = ["disk"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
unic-langid = "0.9.6"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
